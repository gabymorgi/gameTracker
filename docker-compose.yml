services:
  postgres:
    image: postgres:16-alpine
    container_name: gametracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gametracker
    ports:
      - "55432:5432"
    volumes:
      - gametracker-postgres-data:/var/lib/postgresql/data

volumes:
  gametracker-postgres-data:
